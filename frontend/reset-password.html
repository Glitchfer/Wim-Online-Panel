<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atur Ulang Password — WIM Sales</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:28px;width:100%;max-width:400px}
  .logo{font-size:26px;margin-bottom:6px}
  h1{font-size:19px;color:#0f172a;margin-bottom:4px}
  p.sub{color:#64748b;font-size:13px;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:600;color:#334155;margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
  input:focus{outline:2px solid #2563eb;border-color:transparent}
  button{width:100%;margin-top:20px;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:16px;padding:11px;border-radius:8px;font-size:13px;display:none}
  .msg.err{background:#fef2f2;color:#b91c1c;display:block}
  .msg.ok{background:#f0fdf4;color:#15803d;display:block}
  a.login{display:block;text-align:center;margin-top:16px;color:#2563eb;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🗝️</div>
  <h1>Atur Ulang Password</h1>
  <p class="sub">Masukkan password baru untuk akun WIM Sales Anda. Link ini hanya bisa dipakai satu kali.</p>
  <form id="pf" autocomplete="off">
    <input type="hidden" id="tok">
    <label for="pw">Password Baru</label>
    <input type="password" id="pw" placeholder="Minimal 6 karakter" minlength="6" required>
    <label for="pw2">Ulangi Password</label>
    <input type="password" id="pw2" placeholder="Ketik ulang password" minlength="6" required>
    <button type="submit" id="btn">Simpan Password Baru</button>
  </form>
  <div class="msg" id="msg"></div>
  <a class="login" href="index.html" style="display:none" id="loginLink">→ Masuk ke WIM Sales</a>
</div>
<script>
  (function(){
    var tok = new URLSearchParams(location.search).get('token') || '';
    document.getElementById('tok').value = tok;
    if(!tok){ show('err','Link tidak valid — token tidak ditemukan.'); document.getElementById('pf').querySelector('button').disabled=true; return; }
    document.getElementById('pf').addEventListener('submit', function(e){
      e.preventDefault();
      var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
      if(pw.length<6){ show('err','Password minimal 6 karakter'); return; }
      if(pw!==pw2){ show('err','Password tidak cocok.'); return; }
      var btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Menyimpan...';
      fetch('api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:tok,new_password:pw})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
        .then(function(x){
          if(x.j && x.j.error) throw new Error(x.j.error);
          show('ok','Password berhasil diubah. Silakan masuk dengan password baru Anda.');
          document.getElementById('loginLink').style.display='block';
          document.getElementById('pf').style.display='none';
        }).catch(function(err){ btn.disabled=false; btn.textContent='Simpan Password Baru'; show('err',(err&&err.message)||'Terjadi kesalahan. Coba lagi.'); });
    });
    function show(kind,text){var m=document.getElementById('msg');m.className='msg '+kind;m.textContent=text;}
  })();
</script>
</body>
</html>

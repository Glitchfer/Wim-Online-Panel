# nginx template — WIM Online sales app
# Uses nginx envsubst templating: ${API_HOST} and ${API_PORT} are injected
# at container start from the API_HOST / API_PORT environment variables.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy: same-origin /api/* → wim-api ──
    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Static files ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Assets cache ──
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
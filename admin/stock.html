<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIM Admin — Stok On-Hand</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px}
.topnav{background:#1a1a2e;color:#fff;padding:0 24px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100}
.topnav .brand{font-weight:700;font-size:16px;margin-right:32px}.topnav .brand span{color:#8e8ea0;font-weight:400}
.topnav nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.topnav nav a{color:#b0b0c8;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.topnav nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.topnav nav a.active{color:#fff;background:#4361ee}
.topnav .user-info{font-size:12px;color:#8e8ea0;display:flex;align-items:center;gap:8px}
.topnav .user-info .role-badge{background:#4361ee;padding:2px 8px;border-radius:6px;font-size:11px;color:#fff}
.topnav .logout{color:#e63946;cursor:pointer;font-size:12px;margin-left:12px;text-decoration:none}
.container{max-width:1400px;margin:0 auto;padding:24px}
.page-title{font-size:20px;font-weight:700;margin-bottom:20px}
.page-title .sub{font-size:13px;color:#8e8ea0;font-weight:400}
.filters{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;background:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.filters label{font-size:12px;font-weight:600;color:#6c6c80;white-space:nowrap}
.filters input,.filters select{padding:7px 10px;border:1.5px solid #e0e0e8;border-radius:8px;font-size:13px;background:#fff}
.filters .sep{width:1px;height:26px;background:#e0e0e8}
.filters .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#444}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-green{background:#0a7c42;color:#fff}
.btn-blue{background:#4361ee;color:#fff}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 20px;border-bottom:1px solid #f0f2f5;font-size:14px;font-weight:600}
.card-body{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-weight:600;color:#6c6c80;font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:#fafbfc;border-bottom:1px solid #eef0f4}
td{padding:10px 14px;border-bottom:1px solid #f0f2f5}
tr:hover td{background:#f8f9fc}
.status-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.status-ok{background:#d4f5e2;color:#0a7c42}
.status-warn{background:#fff3cd;color:#856404}
.status-info{background:#e8f0fe;color:#4361ee}
.loading{text-align:center;padding:40px;color:#8e8ea0}
.empty-state{text-align:center;padding:40px;color:#8e8ea0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200}
.modal .box{background:#fff;border-radius:12px;padding:24px;width:min(440px,92vw)}
.modal h3{margin-bottom:14px}
.modal label{font-size:12px;font-weight:600;color:#6c6c80;display:block;margin:10px 0 4px}
.modal input,.modal select,.modal textarea{padding:8px 10px;border:1.5px solid #e0e0e8;border-radius:8px;font-size:13px;width:100%}
.modal .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
</style>
</head>
<body data-page="stock">
<div id="appHeader"></div>
<div class="container">
  <div class="page-title">📦 Stok On-Hand <span class="sub">Saldo stok per produk/depo + penyesuaian (audited)</span></div>
  <div class="filters">
    <label>Depo</label>
    <select id="fDepot" onchange="load()"><option value="">Semua Depo</option></select>
    <span class="sep"></span>
    <label class="chk"><input type="checkbox" id="chkLow" onchange="load()"> Hanya stok rendah (&le; 10)</label>
    <span class="sep"></span>
    <button class="btn btn-blue" onclick="openAdjust()">+ Penyesuaian Stok</button>
  </div>
  <div class="card">
    <div class="card-header">Saldo Stok</div>
    <div class="card-body">
      <div class="loading" id="loading">Memuat...</div>
      <table id="stockTable" style="display:none">
        <thead><tr><th>Produk</th><th>SKU</th><th>Depo</th><th>Qty</th><th>Sumber</th><th>Catatan</th><th>Update</th></tr></thead>
        <tbody id="stockBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">Belum ada data stok</div>
    </div>
  </div>
</div>
<div class="modal" id="adjustModal">
  <div class="box">
    <h3>Penyesuaian Stok On-Hand</h3>
    <label>Product ID (dari /api/admin/products)</label>
    <input id="aProductId" placeholder="contoh: 1">
    <label>SKU</label>
    <input id="aSku" placeholder="contoh: SQA-550-K24">
    <label>Depo ID</label>
    <input id="aDepotId" placeholder="contoh: 1">
    <label>Qty (saldo baru)</label>
    <input id="aQty" type="number" step="any" placeholder="0">
    <label>Catatan</label>
    <textarea id="aNote" rows="2" placeholder="alasan penyesuaian"></textarea>
    <div class="row">
      <button class="btn btn-green" onclick="adjust()">Simpan</button>
      <button class="btn" style="background:#e0e0e8;color:#444" onclick="closeAdjust()">Batal</button>
    </div>
  </div>
</div>
<script>
const ADMIN_KEY='wim_admin_token';
let OPTS={depots:[]};
try{const u=JSON.parse(sessionStorage.getItem('admin_user')||'{}');if(document.getElementById('userName'))document.getElementById('userName').textContent=u.name||'-';if(document.getElementById('userRole'))document.getElementById('userRole').textContent=u.role||'-'}catch(e){}
async function api(p,opts){const r=await fetch(p,Object.assign({credentials:'same-origin',headers:{'Accept':'application/json','Content-Type':'application/json'}},opts||{}));if(r.status===401){logout();throw new Error('Session expired')}const d=await r.json();if(!r.ok)throw new Error(d.error||'API error');return d}
function logout(){localStorage.removeItem(ADMIN_KEY);sessionStorage.removeItem('admin_user');fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});location.href='index.html'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function badge(s){s=String(s||'');const c=(s==='seed'||s==='import')?'status-info':'status-ok';return '<span class="status-badge '+c+'">'+esc(s)+'</span>'}
async function loadFilters(){try{const d=await api('/api/admin/filter-options');OPTS.depots=d.depots||[]}catch(e){}document.getElementById('fDepot').innerHTML='<option value="">Semua Depo</option>'+OPTS.depots.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('')}
function buildQuery(){const p=new URLSearchParams();const dep=document.getElementById('fDepot').value,low=document.getElementById('chkLow').checked;if(dep)p.set('depot_id',dep);if(low)p.set('low_only','1');return p.toString()}
async function load(){
  document.getElementById('loading').style.display='block';document.getElementById('stockTable').style.display='none';document.getElementById('emptyState').style.display='none';
  try{const d=await api('/api/admin/stock-balance?'+buildQuery());const rows=d.rows||[];
    document.getElementById('loading').style.display='none';
    if(!rows.length){document.getElementById('emptyState').style.display='block';return}
    document.getElementById('stockTable').style.display='';
    document.getElementById('stockBody').innerHTML=rows.map(r=>'<tr><td>'+esc(r.product_name||'-')+'</td><td style="font-family:monospace">'+esc(r.product_sku||'-')+'</td><td>'+esc(r.depot_name||'-')+'</td><td><b>'+Number(r.qty).toLocaleString('id-ID')+'</b></td><td>'+badge(r.source)+'</td><td>'+esc(r.note||'-')+'</td><td>'+fmtDate(r.updated_at)+'</td></tr>').join('');
  }catch(e){document.getElementById('loading').textContent='Error: '+e.message;document.getElementById('loading').style.display='block'}
}
function fmtDate(v){if(!v)return '-';const d=new Date(v);return isNaN(d.getTime())?'-':d.toLocaleString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function openAdjust(){document.getElementById('adjustModal').style.display='flex'}
function closeAdjust(){document.getElementById('adjustModal').style.display='none'}
async function adjust(){
  const body={product_id:(document.getElementById('aProductId').value||'').trim()||null,
    product_sku:(document.getElementById('aSku').value||'').trim(),
    depot_id:(document.getElementById('aDepotId').value||'').trim()||null,
    qty:(document.getElementById('aQty').value||'').trim(),
    note:(document.getElementById('aNote').value||'').trim(),source:'adjustment'};
  if(!body.product_id && !body.product_sku){alert('Isi Product ID atau SKU');return}
  if(!body.depot_id){alert('Isi Depo ID');return}
  if(body.qty===''){alert('Isi Qty');return}
  try{await api('/api/admin/stock-balance',{method:'POST',body:JSON.stringify(body)});closeAdjust();load()}catch(e){alert('Gagal: '+e.message)}
}
loadFilters();load();
</script>
<div id="appFooter"></div>
<script src="js/include.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIM Admin — Masuk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;display:flex;min-height:100vh;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;padding:48px 40px;width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.login-card h1{font-size:24px;margin-bottom:4px;color:#1a1a2e}
.login-card p{font-size:13px;color:#8e8ea0;margin-bottom:28px}
.form-group{text-align:left;margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#4a4a5a;margin-bottom:4px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e8;border-radius:10px;font-size:14px;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#4361ee}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-primary{background:#4361ee;color:#fff}
.btn-primary:hover{background:#3651d4}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error-msg{color:#e63946;font-size:13px;margin-top:12px;display:none}
.footer{font-size:11px;color:#b0b0c0;margin-top:20px}
.badge{display:inline-block;background:#e8f0fe;color:#4361ee;font-size:11px;padding:2px 8px;border-radius:6px;margin-top:8px}
</style>
</head>
<body>
<div class="login-card">
  <div style="font-size:40px;margin-bottom:8px;">📊</div>
  <h1>WIM Admin Panel</h1>
  <p>Depo Admin &amp; Regional Manager</p>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="nama@perusahaan.com" value="andi@wim.sales" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" value="sandi123" required>
    </div>
    <button type="submit" class="btn btn-primary" id="btnLogin">Masuk</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
  <div class="badge">🔒 Sesi aman — hanya untuk admin terdaftar</div>
  <div class="footer">WIM Online Admin Panel v1</div>
</div>
<script>
const ADMIN_KEY = 'wim_admin_token';
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('errorMsg');
  btn.disabled = true; btn.textContent = '⏳ Memeriksa...'; err.style.display = 'none';
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email:document.getElementById('email').value, password:document.getElementById('password').value})
    });
    const d = await r.json();
    if (r.ok && d.token) {
      localStorage.setItem(ADMIN_KEY, d.token);
      sessionStorage.setItem('admin_user', JSON.stringify(d.user));
      location.href = 'dashboard.html';
    } else {
      err.textContent = d.error || 'Login gagal';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  } catch(e) {
    err.textContent = 'Koneksi error: ' + e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Masuk';
  }
});
</script>
</body>
</html>

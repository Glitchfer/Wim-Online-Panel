# docker-compose.yml — WIM Online SFA Platform
# 4 isolated services: wim-db, wim-api, sales-app, admin-panel
# Usage:
#   cp .env.example .env && docker compose up -d --build
#
# .env values are injected into each container. Never commit the real .env.

version: "3.9"

services:
  wim-db:
    image: postgres:17-alpine
    container_name: wim-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wim_sfa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wim_postgres_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [wim-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wim-api:
    build: ./api
    image: wim-api:local
    container_name: wim-api
    restart: unless-stopped
    environment:
      PORT: 8000
      WIM_PG_HOST: wim-db
      WIM_PG_PORT: 5432
      WIM_PG_DB: ${POSTGRES_DB:-wim_sfa}
      WIM_PG_USER: ${POSTGRES_USER:-postgres}
      WIM_PG_PASS: ${POSTGRES_PASSWORD:-wim_postgres_2026}
      MIN_VISIT_SECONDS: ${MIN_VISIT_SECONDS:-180}
    depends_on:
      wim-db:
        condition: service_healthy
    networks: [wim-net]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  sales-app:
    build: ./sales-app
    image: sales-app:local
    container_name: sales-app
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-wim-api}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${SALES_APP_PORT:-8080}:80"     # public 8080 → nginx :80
    depends_on: [wim-api]
    networks: [wim-net]

  admin-panel:
    build: ./admin
    image: admin-panel:local
    container_name: admin-panel
    restart: unless-stopped
    environment:
      ADMIN_PORT: 8001
      WIM_PG_HOST: wim-db
      WIM_PG_PORT: 5432
      WIM_PG_DB: ${POSTGRES_DB:-wim_sfa}
      WIM_PG_USER: ${POSTGRES_USER:-postgres}
      WIM_PG_PASS: ${POSTGRES_PASSWORD:-wim_postgres_2026}
    depends_on: [wim-db]
    ports:
      - "${ADMIN_PORT:-8081}:8001"
    networks: [wim-net]

volumes:
  pgdata:

networks:
  wim-net:
    driver: bridge